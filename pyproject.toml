[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shin-devig"
version = "0.1.0"
description = "De-vig sportsbook odds into fair probabilities: additive, power, multiplicative, and Shin (1992) methods."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Neel Shah", email = "neeljshah22@gmail.com" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.urls]
Homepage = "https://github.com/neeljshah/shin-devig"

[tool.setuptools.packages.find]
where = ["src"]
